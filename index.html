<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>URGLab · Hospital Universitari Joan XXIII</title>
    <meta name="theme-color" content="#1a6fad">
    <!-- Redirección directa al hub de Joan XXIII (prueba piloto, uso interno Urgencias HJ23).
         La pantalla de selección de hospitales ICS se conserva en hospitales.html
         para reactivarla al escalar a más centros. -->
    <meta http-equiv="refresh" content="0; url=hospital/index.html">
    <script>
    (function(){
      // Registro del icono PWA (mismo que la pantalla original) para que el icono
      // descargado en pantalla de inicio conserve su imagen.
      var svg = '<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="88" fill="#0e1a27"/><polyline points="52,256 132,256 162,194 202,318 242,156 282,256 318,256 340,216 362,256 400,256" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="396" y="196" width="34" height="34" rx="5" fill="white" opacity="0.25"/><rect x="434" y="196" width="34" height="34" rx="5" fill="white" opacity="0.55"/><rect x="396" y="234" width="34" height="34" rx="5" fill="white" opacity="0.55"/><rect x="434" y="234" width="34" height="34" rx="5" fill="white"/><rect x="396" y="272" width="34" height="34" rx="5" fill="white" opacity="0.35"/><rect x="434" y="272" width="34" height="34" rx="5" fill="white" opacity="0.2"/></svg>';
      var img = new Image();
      var blob = new Blob([svg], {type:'image/svg+xml'});
      var url = URL.createObjectURL(blob);
      img.onload = function(){
        var c = document.createElement('canvas');
        c.width = 512; c.height = 512;
        c.getContext('2d').drawImage(img, 0, 0);
        var png = c.toDataURL('image/png');
        URL.revokeObjectURL(url);
        var l = document.createElement('link');
        l.rel = 'apple-touch-icon'; l.href = png;
        document.head.appendChild(l);
        var m = document.createElement('link');
        m.rel = 'manifest';
        var mdata = JSON.stringify({name:'URGlab',short_name:'URGlab',start_url:window.location.pathname,display:'standalone',background_color:'#0e1a27',theme_color:'#1a6fad',icons:[{src:png,sizes:'512x512',type:'image/png',purpose:'any maskable'}]});
        m.href = URL.createObjectURL(new Blob([mdata],{type:'application/manifest+json'}));
        document.head.appendChild(m);
      };
      img.src = url;
      // Redirección por JS (replace: no deja la entrada en el historial, evita bucles con "atrás").
      window.location.replace('hospital/index.html');
    })();
    </script>
    <style>
        html,body{margin:0;height:100%;background:#0e1a27;color:#fff;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
        .wrap{height:100%;display:flex;align-items:center;justify-content:center;
            flex-direction:column;gap:14px;opacity:.85;}
        .dot{width:34px;height:34px;border-radius:50%;
            border:3px solid rgba(255,255,255,.25);border-top-color:#09c797;
            animation:spin .8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg)}}
        p{font-size:.85rem;letter-spacing:.05em;}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="dot"></div>
        <p>Cargando URGLab…</p>
        <noscript><a href="hospital/index.html" style="color:#09c797">Entrar a URGLab</a></noscript>
    </div>
</body>
</html>
