name: Deploy Files

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código (sin SSL)
        run: |
          git config --global http.sslVerify false
          git clone https://${{ github.token }}@git.gtct.intranet.gencat.cat/UrgHJ23/URGLab.git .
          git checkout ${{ github.sha }}

      - name: Instalar rsync
        run: |
          apt-get update
          apt-get install -y rsync openssh-client

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar archivos
        run: |
          rsync -rvz --delete \
            --exclude=".git" \
            --exclude=".gitea" \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/portalaplicacions/cube/web/urgencies
