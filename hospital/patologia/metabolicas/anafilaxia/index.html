<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>URGlab · Anafilaxia</title>
<link rel="stylesheet" href="../../../../fonts.css">
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--border:rgba(0,0,0,0.09);--border-mid:rgba(0,0,0,0.18);
  --text:#1a2636;--muted:#8898aa;
  --blue:#1a7fc8;--blue-dark:#1a6fad;--blue-s:#e8f3fb;
  --teal:#09c797;--teal-s:#e6faf5;
  --epi:#c41520;--epi-s:#fdecec;--epi-border:#f3b4b7;
  --amber:#f0a500;--amber-s:#fff7e6;
  --display:'Barlow Condensed',sans-serif;--body:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:var(--body);color:var(--text);min-height:100svh;padding-bottom:48px}

/* ── HEADER reglamentario ── */
header{
  background:linear-gradient(135deg,#1a7fc8 0%,#1a6fad 100%);
  border-bottom:3px solid var(--teal);
  padding:12px 18px;position:sticky;top:0;z-index:1000;
  display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;min-height:68px;
}
.back-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;
  border-radius:10px;background:rgba(255,255,255,0.15);border:none;cursor:pointer;color:#fff;transition:background .15s}
.back-btn:active{background:rgba(255,255,255,0.28)}
.hdr-center{text-align:center;overflow:hidden}
.hdr-label{font-family:var(--body);font-size:.58rem;font-weight:600;color:#09c797;
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.hdr-title{font-family:var(--display);font-size:1.4rem;font-weight:800;color:#fff;
  letter-spacing:.04em;text-transform:uppercase;line-height:1}
.reset-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;
  border-radius:10px;background:rgba(255,255,255,0.12);border:none;cursor:pointer;color:#fff}
.reset-btn:active{background:rgba(255,255,255,0.26)}

/* ── BREADCRUMB ── */
.prog-wrap{position:sticky;top:68px;z-index:900;background:#fff;border-bottom:1px solid var(--border);padding:9px 0 7px}
.prog-row{max-width:480px;margin:0 auto;padding:0 14px;display:flex;gap:5px}
.prog-col{flex:1;min-width:0;cursor:pointer}
.prog-col:active{opacity:.6}
.prog-seg{height:5px;border-radius:3px;background:#e0e6ed;transition:background .3s}
.prog-col.done .prog-seg{background:var(--teal)}
.prog-col.act .prog-seg{background:var(--blue)}
.prog-lbl{font-family:var(--mono);font-size:.5rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.03em;margin-top:4px;text-align:center;line-height:1.15}
.prog-col.act .prog-lbl{color:var(--blue-dark);font-weight:700}
.btn-taken::after{content:' ✓';font-family:var(--body)}

/* ── CONTENEDOR ── */
.cnt{max-width:480px;margin:0 auto;padding:16px 16px 20px}

/* ── NODO COLAPSADO (historial) ── */
.nsum{background:#fff;border:1px solid var(--border);border-left:3px solid var(--teal);
  border-radius:10px;padding:10px 12px;margin-bottom:9px;cursor:pointer}
.nsum-top{display:flex;align-items:center;gap:9px}
.nsum-check{width:18px;height:18px;border-radius:50%;background:var(--teal);flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.nsum-check svg{width:10px;height:10px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nsum-body{flex:1;min-width:0}
.nsum-title{font-family:var(--display);font-size:.95rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;color:var(--text);line-height:1.05}
.nsum-dec{font-size:.68rem;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.nsum-dec b{color:var(--blue-dark);font-weight:600}
.nsum-chev{color:var(--muted);flex-shrink:0;transition:transform .15s}
.nsum.open .nsum-chev{transform:rotate(90deg)}
.nsum-recap{margin:9px 0 2px;padding-left:27px;display:none}
.nsum.open .nsum-recap{display:block}
.nsum-recap li{font-size:.76rem;color:var(--text);line-height:1.5;list-style:none;position:relative;padding-left:13px}
.nsum-recap li::before{content:'›';position:absolute;left:0;color:var(--teal);font-weight:800}

/* ── NODO ACTIVO ── */
.nactive{background:transparent}
.nhead{display:flex;align-items:center;gap:10px;margin:6px 0 13px}
.nhead-num{width:32px;height:32px;border-radius:9px;background:var(--epi);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.15rem}
.nhead-num.blue{background:var(--blue)}.nhead-num.teal{background:var(--teal)}
.nhead-ttl{font-family:var(--display);font-size:1.5rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.02em;line-height:1;color:var(--text)}

/* ── SCARD ── */
.scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,0.05)}
.scard.epi{border:1.5px solid var(--epi-border)}
.scard-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scard-icon{font-size:1.05rem}
.scard-title{font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--text);
  text-transform:uppercase;letter-spacing:.03em}

/* texto */
.lead{font-size:.85rem;line-height:1.45}
.lead strong{font-weight:700}
.muted-note{font-size:.74rem;line-height:1.4;color:var(--muted);margin-top:8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:7px 0;border-bottom:1px dashed var(--border);font-size:.82rem}
.kv:last-child{border-bottom:none}
.kv-k{color:var(--muted);font-weight:500}
.kv-v{font-family:var(--mono);font-weight:600;text-align:right}
.kv-v.hi{color:var(--blue-dark);font-size:.98rem}
.kv-v.epi{color:var(--epi);font-size:1.05rem}
.tag{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px;vertical-align:middle}
.tag.a{background:var(--blue-s);color:var(--blue-dark)}

/* criterios */
.crit-block{border:1.5px solid var(--border-mid);border-radius:12px;padding:13px 14px;margin-bottom:11px}
.crit-block.c1{border-color:#a8cceb;background:#f5fafe}
.crit-block.c2{border-color:#f3b4b7;background:#fffafa}
.crit-head{font-family:var(--display);font-size:1rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.crit-num{width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.crit-block.c2 .crit-num{background:var(--epi)}
.crit-li{display:flex;gap:8px;font-size:.82rem;line-height:1.4;padding:4px 0}
.crit-li .dot{color:var(--blue);font-weight:800;flex-shrink:0}
.crit-and{font-family:var(--display);font-size:.78rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);text-align:center;margin:6px 0}

/* banners */
.banner{border-radius:12px;padding:11px 13px;font-size:.8rem;line-height:1.4;margin-bottom:12px}
.b-info{background:var(--blue-s);border:1.5px solid #a8cceb}
.b-warn{background:var(--amber-s);border:1.5px solid #f0cd7a}
.b-epi{background:var(--epi-s);border:1.5px solid var(--epi-border)}
.banner b{font-weight:700}

/* no-patient / peso */
.wbar{display:flex;justify-content:space-between;align-items:center;background:var(--blue-s);
  border:1px solid #a8cceb;border-radius:10px;padding:8px 12px;margin-bottom:12px}
.wbar-lbl{font-size:.72rem;color:var(--blue-dark);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wbar-val{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--blue-dark)}
.wpanel{background:var(--amber-s);border:1.5px solid #f0cd7a;border-radius:10px;padding:11px 13px;margin-bottom:12px}
.wpanel-lbl{font-size:.72rem;font-weight:700;color:#9a6500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.wpanel-row{display:flex;gap:8px}
.wpanel-row input{flex:1;border:1.5px solid #e3b95e;border-radius:9px;padding:9px 12px;background:#fff;
  font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--text);outline:none;min-width:0}
.wpanel-row input:focus{border-color:var(--amber)}
.wpanel-btn{font-family:var(--display);font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  color:#fff;background:var(--amber);border:none;border-radius:9px;padding:0 18px;cursor:pointer;white-space:nowrap}
.wpanel-btn:active{opacity:.85}

/* perfusión calc */
.perf{background:var(--surface);border:1.5px solid var(--epi-border);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.perf.blue{border-color:#a8cceb}
.perf-name{font-family:var(--display);font-size:1.1rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.perf-dil{font-size:.67rem;color:var(--muted);font-family:var(--mono);margin:1px 0 10px}
.perf-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;
  border-bottom:1px dashed var(--border);font-size:.82rem}
.perf-row:last-of-type{border-bottom:none}
.perf-key{color:var(--muted)}
.perf-val{font-family:var(--mono);font-weight:600}
.perf-val.hi{color:var(--epi);font-size:1.15rem;font-weight:700}
.perf.blue .perf-val.hi{color:var(--blue-dark)}
.range-wrap{margin:11px 0 4px}
.range-bg{height:8px;border-radius:5px;background:#e6ebf1;overflow:hidden}
.range-fill{height:100%;background:var(--blue);border-radius:5px;width:0;transition:width .2s}
.range-fill.warn{background:var(--epi)}
.range-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:5px}
.range-cur{color:var(--blue-dark);font-weight:700}
.calc2{display:flex;align-items:stretch;gap:8px;margin-top:11px}
.calc-fld{flex:1;border:1.5px solid var(--border-mid);border-radius:10px;padding:8px 10px;background:#fafbfc}
.calc-fld.act{border-color:var(--blue);background:var(--blue-s)}
.calc-fld-lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.calc-fld input{width:100%;border:none;background:transparent;font-family:var(--mono);font-size:1.25rem;font-weight:700;color:var(--text);padding:1px 0;outline:none}
.calc-fld input:read-only{color:var(--blue-dark)}
.calc-fld-unit{font-size:.6rem;color:var(--muted);font-family:var(--mono)}
.calc-swap{display:flex;align-items:center;justify-content:center;width:34px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:1rem;cursor:pointer;flex-shrink:0}
.warnmsg{display:none;font-size:.7rem;color:var(--epi);font-weight:600;margin-top:6px}
.warnmsg.show{display:block}

/* perfusión estilo Fármacos */
.dcard{margin:0 0 10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.dcard-title{font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:10px 16px 6px;border-bottom:1px solid var(--border)}
.info-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-key{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);min-width:52px;padding-top:1px;flex-shrink:0}
.info-val{font-size:.86rem;color:var(--text);line-height:1.4}
.rw{padding:14px 16px 12px}
.rw .range-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:6px}
.range-current-label{color:var(--blue-dark);font-weight:700}
.rw .range-bg{height:8px;background:#e8edf3;border-radius:4px;overflow:hidden;margin-bottom:4px}
.rw .range-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .2s,background .2s}
.rw .range-fill.warn{background:var(--epi)}
.range-text{font-family:var(--mono);font-size:.65rem;color:var(--muted);text-align:center;margin-top:2px}
.dose-warning{background:var(--epi-s);border:1px solid var(--epi-border);border-radius:8px;padding:8px 12px;margin-top:8px;
  font-size:.78rem;color:var(--epi);font-weight:600;text-align:center;display:none}
.dose-warning.show{display:block}
.calc-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 16px 16px}
.calc-field{background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.calc-field.calc-active{border-color:var(--blue);background:#f0f7ff}
.calc-field.calc-active-alt{border-color:var(--teal);background:#f0fdf9}
.calc-field-label{font-size:.67rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.calc-field input{width:100%;border:none;background:transparent;outline:none;font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--text);padding:0}
.calc-field input[readonly]{color:var(--muted);cursor:default}
.calc-field-unit{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:3px}
.swap-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.swap-btn:active{background:#e8edf3}

/* pills (pulso / gravedad) */
.pill-row{display:flex;gap:10px;margin-bottom:12px}
.opt-pill{flex:1;border:2px solid var(--border-mid);border-radius:12px;padding:13px 8px;text-align:center;cursor:pointer;transition:all .12s;background:var(--surface)}
.opt-pill .op-name{font-family:var(--display);font-size:1.1rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.opt-pill .op-sub{font-size:.65rem;color:var(--muted);margin-top:1px}
.opt-pill.sel-blue{border-color:var(--blue);background:var(--blue-s)}
.opt-pill.sel-blue .op-name{color:var(--blue-dark)}
.opt-pill.sel-epi{border-color:var(--epi);background:var(--epi-s)}
.opt-pill.sel-epi .op-name{color:var(--epi)}
.opt-pill.sel-teal{border-color:var(--teal);background:var(--teal-s)}
.opt-pill.sel-teal .op-name{color:#0a8c6a}
.branch{display:none}.branch.show{display:block}

/* checklist mini */
.ci{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .12s}
.ci.ck{background:var(--teal-s);border-color:var(--teal)}
.cibox{width:21px;height:21px;border-radius:6px;border:2px solid var(--border-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.ci.ck .cibox{background:var(--teal);border-color:var(--teal)}
.ck-svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.ci.ck .ck-svg{display:block}
.ci-lbl{font-size:.83rem;font-weight:500;line-height:1.3}

/* lista recordatorio (sin checkbox) */
.rlist{list-style:none;margin:0}
.rlist li{font-size:.82rem;line-height:1.42;padding:8px 0;border-bottom:1px dashed var(--border);position:relative;padding-left:16px}
.rlist li:last-child{border-bottom:none}
.rlist li::before{content:'›';position:absolute;left:0;color:var(--epi);font-weight:800}
.rlist li b{font-weight:700}
.adr-big{background:var(--epi);color:#fff;border-radius:14px;padding:18px 16px;text-align:center;margin-bottom:12px;box-shadow:0 2px 12px rgba(196,21,32,0.25)}
.adr-big .adr-dose{font-family:var(--display);font-size:1.9rem;font-weight:800;letter-spacing:.02em;line-height:1}
.adr-big .adr-site{font-size:.78rem;font-weight:600;opacity:.92;margin-top:5px}
.ci-sub{font-size:.69rem;color:var(--muted);margin-top:1px}

/* input texto libre */
.txt-in{width:100%;border:1.5px solid var(--border-mid);border-radius:9px;padding:10px 12px;
  font-family:var(--body);font-size:.9rem;color:var(--text);outline:none;background:#fafbfc}
.txt-in:focus{border-color:var(--blue);background:#fff}

/* informe unificado (estilo paracentesis) */
.informe-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;
  font-family:var(--mono);font-size:.78rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  color:var(--text);margin-bottom:8px}
.inf-actions{display:flex;gap:8px;margin:0 0 16px}
.inf-actions .btn{flex:1;margin-bottom:0;font-size:1rem}

/* informe (legacy, sin uso) */
.rep{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px}
.rep-sec{font-family:var(--mono);font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--blue-dark);margin:12px 0 5px}
.rep-sec:first-child{margin-top:0}
.rep p{font-size:.82rem;line-height:1.5;margin:0 0 3px}
.rep li{font-size:.82rem;line-height:1.45;margin-left:16px}
.rep b{font-weight:700}
.rec{background:var(--teal-s);border:1.5px solid #7ddfc5;border-radius:12px;padding:14px 15px;margin-bottom:12px}
.rec h4{font-family:var(--display);font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:11px 0 5px;color:#0a7a5c}
.rec h4:first-child{margin-top:0}
.rec p,.rec li{font-size:.81rem;line-height:1.45}
.rec li{margin-left:16px;margin-bottom:2px}
.rec .sub{font-weight:700;color:var(--text);margin-bottom:2px}

/* VMI (estilo IOT) */
.vmi-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.vmi-cap{padding:12px 16px 4px;font-family:var(--display);font-size:1.05rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;color:var(--text)}
.vmi-tbl{width:100%;border-collapse:collapse}
.vmi-tbl th{font-family:var(--mono);font-size:.58rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);padding:8px 16px;text-align:left;
  border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.vmi-tbl td{padding:9px 16px;font-size:.87rem;color:var(--text);border-bottom:1px solid var(--border)}
.vmi-tbl tr:last-child td{border-bottom:none}
.vmi-tbl td:first-child{font-size:.75rem;font-weight:600;color:var(--muted)}
.vt-val{font-family:var(--mono) !important;font-weight:700 !important;color:var(--blue) !important;font-size:1rem !important}

/* algoritmo vía aérea (VORTEX) */
.vortex{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.vortex-rail{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--epi);color:#fff;
  border-radius:10px;padding:12px 7px;font-family:var(--display);font-size:.7rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vortex-col{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.vplan{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;border:2px solid var(--border-mid);background:var(--surface)}
.vplan.a{border-color:#a8cceb}.vplan.b{border-color:#f0cd7a}.vplan.c{border-color:var(--epi-border)}
.vplan-letter{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05rem;color:#fff}
.vplan.a .vplan-letter{background:var(--blue)}
.vplan.b .vplan-letter{background:var(--amber)}
.vplan.c .vplan-letter{background:var(--epi)}
.vplan-name{font-family:var(--display);font-size:1rem;font-weight:800;color:var(--text);text-transform:uppercase;line-height:1.05}
.vplan-desc{font-size:.74rem;color:var(--muted);margin-top:3px;line-height:1.35}
.vplan-desc b{color:var(--text)}
.varrow{text-align:center;color:var(--muted);font-size:1rem;line-height:1}
.vfail{text-align:center;font-size:.76rem;font-weight:700;color:var(--epi);padding:6px 12px;background:var(--epi-s);border-radius:8px}

/* vía aérea V4 */
.v4card{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:2px solid var(--border-mid);border-radius:12px;padding:12px 14px}
.v4card.blue{border-color:#a8cceb}.v4card.amber{border-color:#f0cd7a}
.v4badge{width:30px;height:30px;border-radius:9px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v4t{font-family:var(--display);font-size:1.05rem;font-weight:800;text-transform:uppercase;line-height:1.05}
.v4s{font-size:.75rem;color:var(--muted);margin-top:3px;line-height:1.35}
.v4arrow{text-align:center;color:var(--epi);font-size:.78rem;font-weight:700;margin:7px 0}
.v4arrow .a{color:var(--muted);font-size:1rem;display:block}
.life-row{display:flex;gap:7px}
.life{flex:1;background:var(--surface);border:2px solid var(--border-mid);border-radius:11px;padding:9px 7px;text-align:center}
.life.d{border-color:#cdbbe6}.life.v{border-color:#f0cd7a}
.life-t{font-family:var(--display);font-size:.86rem;font-weight:800;text-transform:uppercase;line-height:1}
.life-s{font-size:.62rem;color:var(--muted);margin-top:3px;line-height:1.2}
.funnel-band{text-align:center;font-size:.74rem;font-weight:700;color:var(--muted);padding:5px;line-height:1.35}
.funnel-band b{color:var(--epi)}
.gate-q2{font-family:var(--display);font-size:1.2rem;font-weight:800;text-transform:uppercase;color:var(--text);text-align:center;margin:12px 0 9px}
.out{border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
.out.yes{background:var(--teal-s);border:2px solid var(--teal)}
.out.no{background:var(--epi-s);border:2px solid var(--epi)}
.out-ic{font-size:1.3rem;flex-shrink:0;line-height:1.1}
.out-t{font-family:var(--display);font-size:1rem;font-weight:800;text-transform:uppercase;line-height:1.05}
.out.yes .out-t{color:#0a7a5c}.out.no .out-t{color:var(--epi)}
.out-s{font-size:.76rem;color:var(--text);margin-top:3px;line-height:1.38}
.out-s b{font-weight:700}
.cone{width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-top:26px solid var(--epi-border)}
.fona2{background:var(--epi);color:#fff;padding:14px 18px;text-align:center}
.fona2-t{font-family:var(--display);font-size:1.3rem;font-weight:800;text-transform:uppercase}
.fona2-s{font-size:.74rem;opacity:.92;margin-top:3px;line-height:1.35}

/* reloj de oxigenación */
.ox-clock{background:var(--epi-s);border:1.5px solid var(--epi-border);border-radius:12px;padding:12px 14px;margin-bottom:11px}
.ox-clock-ttl{font-family:var(--display);font-size:1.1rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--epi);margin-bottom:8px}
.ox-clock-txt{font-size:.8rem;line-height:1.42;color:var(--text);margin-top:7px}
.ox-clock-txt b{font-weight:700}
.satbar{display:flex;height:30px;border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:.6rem;font-weight:700;color:#fff;text-align:center}
.satseg{display:flex;align-items:center;justify-content:center;line-height:1.05;padding:0 2px}
.satseg.ok{background:var(--teal);flex:2}
.satseg.warn{background:var(--amber);flex:1.1}
.satseg.crit{background:var(--epi);flex:1.5}

/* DOPES (estilo IOT) */
.dopes{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
.dope-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.dope-row:last-child{border-bottom:none}
.dope-badge{width:26px;height:26px;border-radius:7px;color:#fff;font-family:var(--display);font-size:1.05rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dope-t{font-size:.85rem;font-weight:600;color:var(--text);line-height:1.25}
.dope-t span{font-weight:400;font-size:.72rem;color:var(--muted)}
.dope-s{font-size:.74rem;color:var(--muted);margin-top:2px;line-height:1.3}

/* divisores y decisiones */
.sec-divider{font-family:var(--display);font-size:1rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.03em;color:#3a4d63;margin:16px 0 9px;padding-left:2px}
.perf-head{font-family:var(--display);font-size:1.15rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.02em;color:var(--text);margin:16px 0 9px;padding-left:2px}
.perf-redsep{font-family:var(--display);font-size:1rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.04em;color:var(--epi);text-align:center;margin:18px 0 10px}
.decide-lbl{font-family:var(--display);font-size:.92rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--text);text-align:center;margin:16px 0 10px}
.decide-lbl-lg{font-size:1.3rem;font-weight:800}
.btn{display:block;width:100%;padding:15px;border-radius:13px;font-family:var(--display);
  font-size:1.18rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;
  border:none;margin-bottom:9px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--blue);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-epi{background:var(--epi);color:#fff;box-shadow:0 2px 10px rgba(196,21,32,0.22)}
.btn-outline{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn:disabled{background:#d7dde5;color:#fff;cursor:not-allowed;box-shadow:none}
.btn-sub{font-family:var(--body);font-size:.66rem;font-weight:500;text-transform:none;
  letter-spacing:0;opacity:.85;display:block;margin-top:2px}
.terminal-tag{text-align:center;font-family:var(--display);font-size:.8rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:14px}
</style>

<script>
// ═══ PESO COMPARTIDO ═══
let patient=null;
try{ const r=localStorage.getItem('hj23_patient'); if(r) patient=JSON.parse(r); }catch(e){}
function getW(){ return (patient&&patient.weight&&+patient.weight>0)? +patient.weight : null; }

function wbarHTML(){
  const w=getW();
  if(w) return '<div class="wbar"><span class="wbar-lbl">Peso en uso</span><span class="wbar-val">'+w+' kg</span></div>';
  return '<div class="wpanel">'+
    '<div class="wpanel-lbl">⚠️ Introduce el peso del paciente</div>'+
    '<div class="wpanel-row">'+
      '<input type="number" id="wIn" inputmode="decimal" min="1" placeholder="kg" '+
        'onkeydown="if(event.key===\'Enter\')setWeightInline()">'+
      '<button class="wpanel-btn" onclick="setWeightInline()">Guardar</button>'+
    '</div></div>';
}
function setWeightInline(){
  const v=parseFloat(document.getElementById('wIn').value);
  if(!v||v<=0) return;
  patient=Object.assign({},patient||{},{weight:v});
  try{ localStorage.setItem('hj23_patient',JSON.stringify(patient)); }catch(e){}
  render();
}

// ═══ DEFINICIÓN DEL ÁRBOL ═══
const NODES={
  sospecha:{
    crumb:'Sospecha diagnóstica', short:'Sospecha Dx', num:'1', numCls:'blue', title:'Sospecha · Diagnóstico',
    recap:['Diagnóstico clínico de anafilaxia (criterios WAO)','Triptasa seriada solicitada (1ª al canalizar vía · 2 h · 6 h)'],
    body:`
      <div class="banner b-info"><b>Anafilaxia altamente probable</b> si se cumple <b>1 de 2 criterios</b> (WAO). Ante la sospecha, no demorar la adrenalina.</div>
      <div class="crit-block c1">
        <div class="crit-head"><span class="crit-num">1</span> Piel/mucosas + 1 sistema</div>
        <div class="lead" style="margin-bottom:6px">Inicio agudo (min–horas) de afectación de <strong>piel y/o mucosas</strong> (urticaria, prurito, flushing, edema labios/úvula/lengua)…</div>
        <div class="crit-and">— y al menos uno de —</div>
        <div class="crit-li"><span class="dot">›</span><span><span class="tag a">A</span> <b>Respiratorio:</b> disnea, broncoespasmo, estridor, hipoxemia</span></div>
        <div class="crit-li"><span class="dot">›</span><span><span class="tag a">B</span> <b>Circulatorio:</b> hipotensión o disfunción orgánica (síncope, hipotonía, incontinencia)</span></div>
        <div class="crit-li"><span class="dot">›</span><span><span class="tag a">C</span> <b>GI severo:</b> dolor abdominal intenso, vómitos repetitivos (sobre todo alérgenos NO alimentarios)</span></div>
      </div>
      <div class="crit-and" style="margin:2px 0 9px">— o bien —</div>
      <div class="crit-block c2">
        <div class="crit-head"><span class="crit-num">2</span> Hipotensión/vía aérea tras alérgeno</div>
        <div class="lead"><strong>Hipotensión, broncoespasmo o afectación laríngea</strong> de aparición aguda tras exposición a alérgeno conocido/probable, <strong>incluso sin clínica cutánea</strong>.</div>
      </div>
      <div class="banner b-info" style="margin-top:2px"><b>El diagnóstico es clínico</b> — no esperar a la triptasa para tratar.</div>
      <div class="scard">
        <div class="scard-hdr"><span class="scard-icon">🧪</span><span class="scard-title">Recordatorio · solicitar triptasa</span></div>
        <div class="kv"><span class="kv-k">1ª muestra</span><span class="kv-v">al canalizar vía · 1ª analítica</span></div>
        <div class="kv"><span class="kv-k">2ª muestra</span><span class="kv-v">a las 2 h</span></div>
        <div class="kv"><span class="kv-k">3ª muestra</span><span class="kv-v">a las 6 h</span></div>
        <div class="muted-note">Significativa: ↑ ≥20% <b>y</b> ≥2 mcg/L sobre la basal.</div>
      </div>`,
    decisions:[ {label:'Cumple criterios · tratar', sub:'también ante la duda', cls:'epi', to:'inicial'} ]
  },

  inicial:{
    crumb:'Tratamiento inicial', short:'Manejo inicial', num:'2', numCls:'epi', title:'Tratamiento inicial',
    recap:['Adrenalina 0,5 mg IM (lo primero, sin demora)','Medidas ABCDE · O₂ · vías · monitorización','Adyuvantes: dexclorfeniramina + metilprednisolona 1 mg/kg','Fluidos solo si hipotensión, según comorbilidades'],
    body:`
      <div class="sec-divider">1 · Adrenalina IM — lo primero, sin demora</div>
      <div class="adr-big"><div class="adr-dose">Adrenalina 0,5 mg IM</div><div class="adr-site">cara anterolateral del muslo · repetir c/5–15 min</div></div>
      <div class="muted-note" style="margin:-4px 0 4px">No esperar a vías ni monitorización para administrarla.</div>

      <div class="sec-divider">2 · Medidas · ABCDE</div>
      <div class="scard">
        <ul class="rlist">
          <li><b>Retirar el alérgeno</b> sin retrasar la adrenalina</li>
          <li><b>Posición:</b> supino con piernas elevadas; semisentado si distrés respiratorio; lateral si vómitos/embarazo</li>
          <li><b>O₂ alto flujo</b> 10–15 L/min · objetivo SatO₂ ≥94%</li>
          <li><b>2 vías periféricas</b> + monitorización (ECG · FC · TA · SatO₂)</li>
        </ul>

      <div id="wbarInicial"></div>

      <div class="sec-divider">3 · Adyuvantes — nunca en monoterapia</div>

        <div class="kv"><span class="kv-k">Dexclorfeniramina IV</span><span class="kv-v">5 mg</span></div>
        <div class="kv"><span class="kv-k">Metilprednisolona IV (1 mg/kg)</span><span class="kv-v hi" id="metilDose">1 mg/kg</span></div>
        <div class="kv"><span class="kv-k">Salbutamol ± ipratropio neb.</span><span class="kv-v">si broncoespasmo</span></div>
        <div class="kv"><span class="kv-k">Fluidoterapia</span><span class="kv-v">a considerar si hipoTA</span></div>
        <div class="muted-note">Fluidos solo si hipotensión, individualizando según comorbilidades (cardiopatía, insuf. renal…). Evitar cargas indiscriminadas.</div>
      </div>`,
    init(){ const wb=document.getElementById('wbarInicial'); if(wb) wb.innerHTML=wbarHTML(); const w=getW(); const e=document.getElementById('metilDose'); if(e) e.textContent = w?(1*w)+' mg':'1 mg/kg'; },
    decideLabel:'Reevaluar a los 5–15 min',
    decisions:[
      {label:'Mejora', sub:'respuesta clínica', cls:'teal', to:'observacion'},
      {label:'No responde', sub:'persisten síntomas', cls:'epi', to:'segunda'}
    ]
  },

  segunda:{
    crumb:'No responde', short:'Persistente', num:'3', numCls:'epi', title:'Segunda dosis IM',
    recap:['2ª dosis de adrenalina IM 0,5 mg','Reevaluar ABC · optimizar fluidos/broncodilatador si precisa'],
    body:`
      <div class="adr-big"><div class="adr-dose">Adrenalina 0,5 mg IM</div><div class="adr-site">2ª dosis · intervalo 5–15 min desde la 1ª</div></div>
      <div class="muted-note" style="margin:-4px 0 8px">La mayoría responde a la 1ª–2ª dosis.</div>
      <div class="scard">
        <ul class="rlist">
          <li><b>Reevaluar ABC</b> (vía aérea · ventilación · circulación)</li>

          <li><b>Tratamiento broncodilatador</b> si precisa</li>

    decideLabel:'¿Respuesta tras la 2ª dosis?',
    decisions:[
      {label:'Mejora', sub:'respuesta clínica', cls:'teal', to:'observacion'},
      {label:'Refractaria', sub:'≥2 dosis IM sin respuesta', cls:'epi', to:'refractaria'}

  refractaria:{
    crumb:'Refractaria', short:'Refractaria', num:'4', numCls:'epi', title:'Anafilaxia refractaria',
    recap:['Perfusión de adrenalina IV iniciada','± Noradrenalina / glucagón / atropina / MgSO₄','Valorar UCI'],
    body:`
      <div class="banner b-warn"><b>Refractaria</b> — sin respuesta tras ≥2 dosis IM. Iniciar perfusión IV.</div>
      <div id="wbarRefr"></div>
      <div class="perf-head">Perfusión de adrenalina</div>
      <div class="dcard">
        <div class="dcard-title">Preparación</div>
        <div class="info-row"><span class="info-key">PRES.</span><span class="info-val">1 mg/1 ml</span></div>
        <div class="info-row"><span class="info-key">DILUC.</span><span class="info-val">1 mg en 100 ml · 10 mcg/ml · SF 0,9%</span></div>
        <div class="info-row"><span class="info-key">NOTA</span><span class="info-val">Inicio 0,1 mcg/kg/min · incrementos 0,05 mcg/kg/min. Proteger de la luz. Necrosante si extravasa (antídoto fentolamina); vía periférica gruesa o intraósea.</span></div>
      </div>
      <div class="dcard">
        <div class="dcard-title">Calculadora</div>
        <div class="rw">
          <div class="range-labels"><span>0,05</span><span class="range-current-label" id="adrCur">—</span><span>1</span></div>

          <button class="swap-btn" onclick="pToggle('adr')">⇄</button>

          <div class="range-bg"><div class="range-fill" id="neBar"></div></div>
          <div class="range-text">Rango: 0,05 – 1 mcg/kg/min</div>

        </div>
        <div class="calc-grid">
          <div class="calc-field calc-active" id="neFldDose" onclick="pMode('ne','dose')">

            <div class="calc-field-unit">ml/hora</div></div>

      </div>

      <div class="sec-divider">Otros refractarios</div>
      <div class="scard">
        <div class="kv"><span class="kv-k">Glucagón (si betabloqueantes)</span><span class="kv-v">1 mg en 5 min IV</span></div>
        <div class="kv"><span class="kv-k">Atropina (si bradicardia)</span><span class="kv-v">1 mg IV</span></div>
        <div class="kv"><span class="kv-k">MgSO₄ (broncoespasmo persistente)</span><span class="kv-v">2 g en 20 min</span></div>
      </div>`,

    decideLabel:'¿Evolución?',

  },

  amax4:{
    crumb:'AMAX4', short:'Crítica', num:'6', numCls:'epi', title:'AMAX4 · Inconsciente',
    recap:['AMAX4 — soporte vital avanzado en anafilaxia'],
    body:`
      <div class="banner b-epi"><b>AMAX4.</b> Gatillo: ≥2 adrenalina IM + insuf. respiratoria hipoxémica severa + ↓ consciencia. <b>4 min</b> hasta lesión cerebral hipóxica.</div>

          <div class="perf-dil">1 mg/9 ml → 100 mcg/ml; de ahí 1 ml/9 ml → 10 mcg/ml</div>
          <div class="perf-row"><span class="perf-key">Dosis · 1 mcg/kg<br><span style="font-size:.68rem">c/1–3 min · según requerimientos</span></span><span class="perf-val hi" id="pushMcg">— mcg</span></div>
          <div class="perf-row"><span class="perf-key">Volumen (a 10 mcg/ml)</span><span class="perf-val" id="pushMl">— ml</span></div>
        </div>
      <div class="sec-divider">Vía aérea</div>
      <div class="ox-clock">
        <div class="ox-clock-ttl">⏱ La prioridad es oxigenar</div>
        <div class="satbar">
          <div class="satseg ok">≥90<br>seguro</div>
          <div class="satseg warn">80–90<br>alerta</div>
          <div class="satseg crit">&lt;80<br>crítico</div>
        </div>
        <div class="ox-clock-txt"><b>SpO₂ &lt;80 %</b> durante <b>&gt;4 min seguidos</b> → lesión cerebral hipóxica. <b>Mientras la SpO₂ se mantenga &gt;90 %</b> tienes margen para elegir estrategia.</div>
      </div>

      <div class="v4card blue">
        <div class="v4badge" style="background:var(--blue)">1</div>
        <div><div class="v4t">Intubación · 1er intento óptimo</div>
          <div class="v4s"><b style="color:var(--text)">Videolaringoscopia</b> · mejor intubador · tubo con balón · Ketamina <b id="ketaDose" style="color:var(--text)">1 mg/kg</b> + Rocuronio <b id="rocuDose" style="color:var(--text)">1,2 mg/kg</b></div></div>
      </div>
      <div class="v4arrow"><span class="a">↓</span>intubación fallida</div>

      <div class="v4card amber">
        <div class="v4badge" style="background:var(--amber)">2</div>
        <div><div class="v4t">Reoxigenar</div>
          <div class="v4s">BVM / DSG mientras decides la siguiente estrategia.</div></div>
      </div>
      <div class="life-row" style="margin:6px 0">
        <div class="life v"><div class="life-t">BVM</div><div class="life-s">2 personas · Guedel</div></div>
        <div class="life d"><div class="life-t">DSG</div><div class="life-s">i-gel / Fastrach</div></div>
      </div>
      <div class="funnel-band">⚠ broncoespasmo severo → <b>alta resistencia</b>: la reoxigenación puede ser inefectiva</div>

      <div class="gate-q2">¿Reoxigenas por encima de 90 %?</div>
      <div class="out yes">
        <div class="out-ic">↻</div>
        <div><div class="out-t">Sí · SpO₂ &gt;90 %</div>
          <div class="out-s">Optimizar laringoscopia (CCMRL) · nuevo intento de IOT · cambiar estrategia a VAFI.</div></div>
      </div>
      <div class="out no">
        <div class="out-ic">⛔</div>
        <div><div class="out-t">No remonta &gt;90 %</div>
          <div class="out-s">En periparada por anafilaxia la reoxigenación suele ser inefectiva. <b>No demores la vía quirúrgica.</b></div></div>
      </div>
      <div style="display:flex;justify-content:center"><div class="cone"></div></div>
      <div class="fona2" style="border-radius:14px"><div class="fona2-t">🔪 Cricotiroidotomía</div><div class="fona2-s">sin demora · evita la lesión cerebral hipóxica</div></div>

      <a href="../../../procedimientos/iot/index.html" style="display:block;text-align:center;margin-top:9px;font-family:var(--body);font-size:.78rem;font-weight:600;color:var(--blue-dark);text-decoration:none;padding:5px">Abrir checklist de intubación (IOT) →</a>
      <div class="sec-divider">Ventilación</div>
      <div class="vmi-card">
        <div class="vmi-cap">Parámetros VMI</div>
        <table class="vmi-tbl">
          <tr><th>Parámetro</th><th>Valor</th></tr>
          <tr><td>Modo</td><td>AC/VC</td></tr>
          <tr><td>VT (6 ml/kg)</td><td class="vt-val" id="vtMl">6 ml/kg</td></tr>
          <tr><td>FR</td><td>10 rpm</td></tr>
          <tr><td>PEEP</td><td>0 cmH₂O</td></tr>
          <tr><td>FiO₂</td><td>100%</td></tr>
          <tr><td>Flujo</td><td>80–100 L/min</td></tr>
          <tr><td>I:E</td><td>1:3 – 1:5</td></tr>
        </table>
      </div>
      <div class="sec-divider">Si hipoxemia persistente tras IOT · DOPES</div>
      <div class="dopes">
        <div class="dope-row"><div class="dope-badge" style="background:var(--blue)">D</div><div><div class="dope-t">Desplazamiento del tubo</div><div class="dope-s">Comprobar posición (capnografía, auscultación)</div></div></div>
        <div class="dope-row"><div class="dope-badge" style="background:#7b5ea7">O</div><div><div class="dope-t">Obstrucción del tubo</div><div class="dope-s">Aspirar secreciones · descartar acodamiento</div></div></div>
        <div class="dope-row"><div class="dope-badge" style="background:#e07b00">P</div><div><div class="dope-t">Neumotórax <span>(Pneumothorax)</span></div><div class="dope-s">Eco clínica / Rx tórax → descompresión torácica si se confirma</div></div></div>
        <div class="dope-row"><div class="dope-badge" style="background:var(--teal)">E</div><div><div class="dope-t">Equipo</div><div class="dope-s">Descartar fallo del ventilador / fuente de O₂</div></div></div>
        <div class="dope-row"><div class="dope-badge" style="background:var(--epi)">S</div><div><div class="dope-t">Stacking <span>(atrapamiento aéreo · auto-PEEP)</span></div><div class="dope-s">Desconectar del respirador + compresión torácica lateral para espirar</div></div></div>
      </div>
      </div>`,
    init(){ renderAmax4(); },
    decisions:[]
  },

  observacion:{
    crumb:'Observación', short:'Observación', num:'5', numCls:'teal', title:'Observación y alta',
    recap:['Observación según gravedad','Criterios de alta valorados'],
    body:`
      <div class="decide-lbl">Gravedad del episodio</div>
      <div class="pill-row">
        <div class="opt-pill" id="gravLeve" onclick="selGrav('leve')"><div class="op-name">Leve–mod.</div><div class="op-sub">cutánea/GI, sin afectación resp. ni circulatoria</div></div>
        <div class="opt-pill" id="gravGrave" onclick="selGrav('grave')"><div class="op-name">Grave/bifásica</div><div class="op-sub">compromiso resp./circulatorio, hipoTA o recurrencia</div></div>
      </div>
      <div class="banner b-info" id="obsTime"><b>Observación mínima:</b> selecciona la gravedad para ver el tiempo.</div>

      <div class="sec-divider">Criterios de alta (estabilidad)</div>
      <div class="ci crit-alta" onclick="toggleCrit(this)"><div class="cibox"><svg class="ck-svg" viewBox="0 0 13 13"><polyline points="2,6.5 5.5,10 11,3"/></svg></div><div><div class="ci-lbl">Estabilidad hemodinámica sostenida</div></div></div>
      <div class="ci crit-alta" onclick="toggleCrit(this)"><div class="cibox"><svg class="ck-svg" viewBox="0 0 13 13"><polyline points="2,6.5 5.5,10 11,3"/></svg></div><div><div class="ci-lbl">Ausencia de compromiso respiratorio</div></div></div>
      <div class="ci crit-alta" onclick="toggleCrit(this)"><div class="cibox"><svg class="ck-svg" viewBox="0 0 13 13"><polyline points="2,6.5 5.5,10 11,3"/></svg></div><div><div class="ci-lbl">Sin recurrencia de síntomas</div></div></div>

      <button class="btn btn-primary" id="altaBtn" disabled onclick="goAlta()" style="margin-top:10px">Recomendaciones médicas al alta →<span class="btn-sub" id="altaBtnSub">marca los criterios de estabilidad</span></button>`,
    init(){ if(state.gravedad) selGrav(state.gravedad);
      const set=new Set(state.criterios||[]);
      document.querySelectorAll('#activeNode .crit-alta').forEach(el=>{ el.classList.toggle('ck', set.has(el.querySelector('.ci-lbl').textContent.trim())); });
      updateAltaBtn(); },
    decisions:[]
  },

  alta:{
    crumb:'Alta', short:'Alta', num:'7', numCls:'teal', title:'Recomendaciones al alta',
    recap:['Recomendaciones médicas al alta generadas'],
    body:`
      <div class="sec-divider">Medicación al alta</div>
      <div class="scard">
        <div class="kv-k" style="margin-bottom:6px">Antihistamínico oral (elección del médico) · 5 días</div>
        <input type="text" id="antiH1In" class="txt-in" placeholder="p. ej. cetirizina, bilastina, desloratadina…" oninput="state.antiH1=this.value;renderAltaReport()">
        <div class="kv-k" style="margin:12px 0 6px">Corticoide oral (elección del médico) · 5 días</div>
        <input type="text" id="cortIn" class="txt-in" placeholder="p. ej. prednisona, metilprednisolona…" oninput="state.corticoide=this.value;renderAltaReport()">
        <div class="kv-k" style="margin:12px 0 6px">Autoinyector de adrenalina · 2 unidades</div>
        <div class="pill-row" style="margin-bottom:0">
          <div class="opt-pill" id="aiAltellus" onclick="selAuto('Altellus');renderAltaReport()"><div class="op-name">Altellus</div><div class="op-sub">300 mcg</div></div>
          <div class="opt-pill" id="aiJext" onclick="selAuto('Jext');renderAltaReport()"><div class="op-name">Jext</div><div class="op-sub">300 mcg</div></div>
        </div>
      </div>
      <div class="sec-divider">Historia clínica</div>
      <pre class="informe-box" id="repHC"></pre>
      <div class="inf-actions">
        <button class="btn btn-outline" onclick="copyReport('repHC')">📋 Copiar</button>
        <button class="btn btn-primary" onclick="downloadReport('repHC','alta-anafilaxia')">⬇ Descargar</button>
      </div>
      <div class="sec-divider">Recomendaciones para el paciente</div>
      <pre class="informe-box" id="repPac"></pre>
      <div class="inf-actions">
        <button class="btn btn-outline" onclick="copyReport('repPac')">📋 Copiar</button>
        <button class="btn btn-primary" onclick="downloadReport('repPac','recomendaciones-paciente')">⬇ Descargar</button>
      </div>`,
    init(){ if(state.autoinyector) selAuto(state.autoinyector);
      const i=document.getElementById('antiH1In'); if(i) i.value=state.antiH1||'';
      const c=document.getElementById('cortIn'); if(c) c.value=state.corticoide||'';
      renderAltaReport(); },
    decisions:[]
  }
};
const START='sospecha';

// ═══ ESTADO DEL ÁRBOL ═══
let path=[START];
let activeIdx=0;       // nodo enfocado dentro de path
let taken={};          // {nodeId: decisionLabel}
let state={gravedad:null, obsTime:'', antiH1:'', corticoide:'', autoinyector:null, criterios:[]};
let informeTxt='';     // versión texto plano para copiar

function render(){
  // barra de progreso (clicable)
  let pb='<div class="prog-row">';
  path.forEach((id,i)=>{
    pb+='<div class="prog-col '+(i===activeIdx?'act':'done')+'" onclick="goIdx('+i+')">'+
          '<div class="prog-seg"></div><div class="prog-lbl">'+(NODES[id].short||NODES[id].crumb)+'</div></div>';
  });
  pb+='</div>';
  document.getElementById('progbar').innerHTML=pb;
  // flujo
  const flow=document.getElementById('flow'); let h='';
  path.forEach((id,i)=>{
    const n=NODES[id];
    if(i!==activeIdx){
      h+='<div class="nsum" onclick="goIdx('+i+')">'+
           '<div class="nsum-top">'+
             '<div class="nsum-check"><svg viewBox="0 0 13 13"><polyline points="2,6.5 5.5,10 11,3"/></svg></div>'+
             '<div class="nsum-body"><div class="nsum-title">'+n.title+'</div>'+
               (taken[id]?'<div class="nsum-dec">Decisión: <b>'+taken[id]+'</b></div>':'')+'</div>'+
             '<svg class="nsum-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'+
           '</div>'+
         '</div>';
    } else {
      h+='<div class="nactive" id="activeNode">'+
           '<div class="nhead"><div class="nhead-num '+(n.numCls||'')+'">'+n.num+'</div><div class="nhead-ttl">'+n.title+'</div></div>'+
           n.body;
      if(n.decisions && n.decisions.length){
        if(n.decideLabel) h+='<div class="decide-lbl">'+n.decideLabel+'</div>';
        n.decisions.forEach((d,di)=>{
          const isTaken=(taken[id]===d.label);
          h+='<button class="btn btn-'+d.cls+(isTaken?' btn-taken':'')+'" onclick="choose('+di+')">'+d.label+
             (d.sub?'<span class="btn-sub">'+d.sub+'</span>':'')+'</button>';
        });
      }
      if(n.terminal) h+='<div class="terminal-tag">— '+n.terminal+' —</div>';
      h+='</div>';
    }
  });
  flow.innerHTML=h;
  const cn=NODES[path[activeIdx]]; if(cn.init) cn.init();
  const an=document.getElementById('activeNode');
  if(activeIdx>0 && an){
    const hd=document.querySelector('header'), bar=document.getElementById('progbar');
    const off=(hd?hd.offsetHeight:68)+(bar?bar.offsetHeight:36)+8;
    // espaciador para que el nodo activo pueda fijarse justo bajo la barra
    const need=Math.max(0, window.innerHeight - off - an.offsetHeight);
    if(need>0){ const sp=document.createElement('div'); sp.style.height=need+'px'; sp.setAttribute('aria-hidden','true'); flow.appendChild(sp); }
    const y=an.getBoundingClientRect().top + window.pageYOffset - off;
    window.scrollTo(0, y<0?0:y);
  } else window.scrollTo(0,0);
}

function goIdx(i){ if(i>=0 && i<path.length){ activeIdx=i; render(); } }

function choose(di){
  const id=path[activeIdx], n=NODES[id], d=n.decisions[di];
  taken[id]=d.label;
  path=path.slice(0,activeIdx+1);   // re-decidir desde aquí trunca lo posterior
  path.push(d.to);
  activeIdx=path.length-1;
  render();
}
function undo(){
  if(activeIdx>0){ activeIdx--; render(); }
  else window.location.href='../index.html';
}
function restart(){ path=[START]; activeIdx=0; taken={}; state={gravedad:null,obsTime:'',antiH1:'',corticoide:'',autoinyector:null,criterios:[]}; informeTxt=''; render(); }
function toggleCk(el){ el.classList.toggle('ck'); }

// ═══ CALCULADORAS DE PERFUSIÓN (estilo Fármacos) ═══
const PERF={ adr:{conc:10,min:0.05,max:1,start:0.1}, ne:{conc:80,min:0.05,max:1,start:0.1} };
const perfEdit={adr:'dose', ne:'dose'};
function doseToMlh(dose,conc,w){ return (dose*w*60)/conc; }
function mlhToDose(mlh,conc,w){ return (mlh*conc)/(w*60); }

function renderRefractaria(){
  const wb=document.getElementById('wbarRefr'); if(wb) wb.innerHTML=wbarHTML();
  ['adr','ne'].forEach(pInitCalc);
}
function pInitCalc(key){
  const w=getW(), P=PERF[key];
  perfEdit[key]='dose'; pMode(key,'dose');
  const d=document.getElementById(key+'Dose'), m=document.getElementById(key+'Mlh');
  if(!d||!m) return;
  if(w){ d.value=P.start; pFromDose(key); } else { d.value=''; m.value=''; pBar(key,0); }
}
function pMode(key,mode){
  perfEdit[key]=mode;
  const fd=document.getElementById(key+'FldDose'), fm=document.getElementById(key+'FldMlh');
  const id=document.getElementById(key+'Dose'), im=document.getElementById(key+'Mlh');
  if(!fd) return;
  fd.classList.toggle('calc-active',mode==='dose');
  fm.classList.toggle('calc-active-alt',mode==='mlh');
  id.readOnly=(mode!=='dose'); im.readOnly=(mode!=='mlh');
}
function pToggle(key){ pMode(key, perfEdit[key]==='dose'?'mlh':'dose'); }
function pFromDose(key){
  const w=getW(), P=PERF[key]; if(!w){pBar(key,0);return;}
  const dose=parseFloat(document.getElementById(key+'Dose').value)||0;
  document.getElementById(key+'Mlh').value = dose>0? doseToMlh(dose,P.conc,w).toFixed(1):'';
  pBar(key,dose);
}
function pFromMlh(key){
  const w=getW(), P=PERF[key]; if(!w){pBar(key,0);return;}
  const mlh=parseFloat(document.getElementById(key+'Mlh').value)||0;
  const dose=mlhToDose(mlh,P.conc,w);
  document.getElementById(key+'Dose').value = dose>0? +dose.toFixed(3):'';
  pBar(key,dose);
}
function pBar(key,dose){
  const P=PERF[key], out=dose>0&&(dose>P.max||dose<P.min);
  const pct=Math.min(100,Math.max(0,((dose-P.min)/(P.max-P.min))*100));
  const bar=document.getElementById(key+'Bar'); if(!bar) return;
  bar.style.width=(dose>P.max?100:pct)+'%'; bar.classList.toggle('warn',out);
  document.getElementById(key+'Cur').textContent=dose>0?(+dose.toFixed(3)):'—';
  document.getElementById(key+'Warn').classList.toggle('show',out);
}

function renderAmax4(){
  const wb=document.getElementById('wbarAmax'); if(wb) wb.innerHTML=wbarHTML();
  const w=getW();
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set('rocuDose', w?(1.2*w).toFixed(0)+' mg':'1,2 mg/kg');
  set('ketaDose', w?(1*w).toFixed(0)+' mg':'1 mg/kg');
  set('vtMl',     w?(6*w).toFixed(0)+' ml':'6 ml/kg');
  set('pushMcg',  w?(1*w).toFixed(0)+' mcg':'— mcg');
  set('pushMl',   w?((1*w)/10).toFixed(1)+' ml':'— ml');
}
function selPulso(v){
  document.getElementById('pulsoSi').classList.toggle('sel-blue',v==='si');
  document.getElementById('pulsoNo').classList.toggle('sel-epi',v==='no');
  document.getElementById('branchSi').classList.toggle('show',v==='si');
  document.getElementById('branchNo').classList.toggle('show',v==='no');
}
function selGrav(v){
  state.gravedad=v;
  document.getElementById('gravLeve').classList.toggle('sel-teal',v==='leve');
  document.getElementById('gravGrave').classList.toggle('sel-epi',v==='grave');
  const b=document.getElementById('obsTime');
  if(v==='leve'){ state.obsTime='6–8 h'; b.innerHTML='<b>Observación mínima: 6–8 h</b> · anafilaxia leve–moderada.'; }
  else { state.obsTime='12–24 h'; b.innerHTML='<b>Observación mínima: 12–24 h</b> · grave, reacción bifásica o comorbilidades.'; }
}
function selAuto(v){
  state.autoinyector=v;
  const a=document.getElementById('aiAltellus'), j=document.getElementById('aiJext');
  if(a) a.classList.toggle('sel-blue',v==='Altellus');
  if(j) j.classList.toggle('sel-blue',v==='Jext');
}

// ═══ CRITERIOS DE ALTA + ACCESO ═══
function toggleCrit(el){ el.classList.toggle('ck'); syncCritState(); updateAltaBtn(); }
function syncCritState(){
  state.criterios=[].slice.call(document.querySelectorAll('#activeNode .crit-alta.ck .ci-lbl')).map(e=>e.textContent.trim());
}
function updateAltaBtn(){
  const btn=document.getElementById('altaBtn'); if(!btn) return;
  const all=document.querySelectorAll('#activeNode .crit-alta').length;
  const ck =document.querySelectorAll('#activeNode .crit-alta.ck').length;
  const ready=(all>0 && ck===all);
  btn.disabled=!ready;
  const sub=document.getElementById('altaBtnSub');
  if(sub) sub.textContent = ready ? 'criterios de estabilidad cumplidos' : 'marca los criterios de estabilidad';
}
function goAlta(){
  const id=path[activeIdx];
  syncCritState();
  taken[id]='Alta';
  path=path.slice(0,activeIdx+1);
  path.push('alta');
  activeIdx=path.length-1;
  render();
}

// ═══ INFORME DE ALTA (dos bloques copiables) ═══
function renderAltaReport(){
  const obs = state.obsTime || (state.gravedad==='grave'?'12–24 h':state.gravedad==='leve'?'6–8 h':'—');
  const antiH1 = state.antiH1 ? state.antiH1 : '(a criterio médico)';
  const cort = state.corticoide ? state.corticoide : '(a criterio médico)';
  const autoiny = state.autoinyector ? state.autoinyector+' 300 mcg' : 'Altellus / Jext 300 mcg';
  const fecha = new Date().toLocaleDateString('es-ES');

  // ── Bloque 1 · historia clínica ──
  const repHC =
'ALTA — ANAFILAXIA · Urgencias HJ23 · '+fecha+'\n'+
'\nPaciente con anafilaxia, estable, que cumple criterios de alta tras observación ('+obs+').\n'+
'\nMEDICACIÓN AL ALTA\n'+
'- Antihistamínico oral: '+antiH1+' durante 5 días.\n'+
'- Corticoide oral: '+cort+' durante 5 días.\n'+
'- Autoinyector de adrenalina: 2 unidades ('+autoiny+').\n'+
'\nRECOMENDACIONES\n'+
'- Evitación del alérgeno conocido o sospechado.\n'+
'- Volver a Urgencias si reaparecen los síntomas.\n'+
'- Se solicita visita con Alergología.';

  // ── Bloque 2 · recomendaciones para el paciente ──
  const repPac =
'PLAN DE ACCIÓN PARA EL PACIENTE — ANAFILAXIA\n'+
'\nRECONOCER UNA REACCIÓN LEVE–MODERADA\n'+
'(hinchazón de labios/ojos/cara, ronchas, picor, hormigueo en boca, dolor abdominal o vómitos)\n'+
'- Quédese acompañado y pida ayuda.\n'+
'- Localice el autoinyector de adrenalina.\n'+
'- Avise a su contacto de emergencia.\n'+
'- Retire el alérgeno si es posible.\n'+
'\nRECONOCER UNA ANAFILAXIA (REACCIÓN GRAVE)\n'+
'(dificultad para respirar, tos persistente, pitidos, lengua hinchada, cambio de voz, palidez o pérdida de consciencia)\n'+
'- Administre el autoinyector de adrenalina de inmediato.\n'+
'- Tumbe a la persona: si tiene dificultad para respirar, sentada con las piernas estiradas; si está inconsciente o embarazada, en posición lateral de seguridad.\n'+
'- Llame al 061 y a su contacto de emergencia.\n'+
'- Administre una 2ª dosis a los 5 minutos si no mejora. Ante la duda, administre adrenalina.\n'+
'- Si no responde o respira de forma anormal, inicie RCP.\n'+
'\nCÓMO USAR EL AUTOINYECTOR\n'+
'- Retire la tapa de seguridad.\n'+
'- Aplique el extremo en la cara externa del muslo en ángulo recto (90°).\n'+
'- Presione con firmeza hasta oír el «clic» y manténgalo 10 segundos.\n'+
'\nSIEMPRE\n'+
'- Lleve 2 autoinyectores consigo.\n'+
'- Evite el alérgeno conocido o sospechado.\n'+
'- Acuda a la cita de Alergología.';

  const hc=document.getElementById('repHC'); if(hc) hc.textContent=repHC;
  const pac=document.getElementById('repPac'); if(pac) pac.textContent=repPac;
}
function copyReport(boxId){
  navigator.clipboard.writeText(document.getElementById(boxId).textContent);
  const btn=event.target; btn.textContent='✓ Copiado'; setTimeout(function(){btn.textContent='📋 Copiar';},1800);
}
function downloadReport(boxId,prefix){
  const text=document.getElementById(boxId).textContent;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(text);
  a.download=(prefix||'anafilaxia')+'_'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
}

render();
</script>
</body>
</html>
